name: Coverage

on:
  # Feature branches too: work that only meets CI at merge time meets it too
  # late, and every branch in this repo is a feature or fix branch by policy.
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'test/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install a browser for the e2e suite
        run: uv run playwright install --with-deps chromium

      - name: Run tests with coverage
        env:
          RPFR_VISUALIZER_E2E_CHANNEL: chromium
        run: |
          uv run pytest tests/ --cov=rpfr_visualizer --cov-report=xml --cov-report=html --cov-report=term

      - name: Generate coverage badge
        run: |
          uv run coverage report --format=total > coverage.txt
          echo "COVERAGE=$(cat coverage.txt)" >> $GITHUB_ENV

      # No Codecov upload here. test.yml already uploads the same coverage of
      # the same commit; a second upload of an identical report only makes the
      # Codecov history ambiguous about which run a number came from. This job
      # exists for the browsable HTML artifact.
      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
