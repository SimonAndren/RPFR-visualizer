name: Lint

on:
  # Feature branches too: work that only meets CI at merge time meets it too
  # late, and every branch in this repo is a feature or fix branch by policy.
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'test/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run ruff linter
        run: |
          uv run ruff check src/ tests/ scripts/ --output-format=github

      - name: Run ruff formatter check
        run: |
          uv run ruff format src/ tests/ scripts/ --check

      - name: Check notebooks are stripped of outputs
        run: |
          uv run python scripts/check_notebook_outputs.py

      - name: Run mypy type checker
        run: |
          uv run mypy src/rpfr_visualizer --ignore-missing-imports
        continue-on-error: true  # Type checking is advisory for now
